<template>
    <lightning-card title="Integration Monitor" icon-name="utility:connected_apps">
        <div slot="actions">
            <template if:true={isConfigured}>
                <lightning-button label="Refresh" icon-name="utility:refresh" onclick={handleRefresh}></lightning-button>
            </template>
        </div>
        <div class="slds-var-m-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </template>

            <!-- Not Configured -->
            <template if:false={isConfigured}>
                <div class="slds-illustration slds-illustration_small slds-var-m-around_medium slds-text-align_center">
                    <lightning-icon icon-name="utility:connected_apps" size="large" class="slds-var-m-bottom_medium"></lightning-icon>
                    <h3 class="slds-text-heading_medium slds-var-m-bottom_small">Integration Logging Not Configured</h3>
                    <p class="slds-text-body_regular">{configMessage}</p>
                    <p class="slds-text-body_small slds-var-m-top_medium slds-text-color_weak">
                        Create the <strong>Integration_Log__c</strong> custom object in the integration phase to enable this monitor.
                    </p>
                    <div class="slds-var-m-top_medium">
                        <div class="slds-grid slds-gutters slds-grid_align-center">
                            <div class="slds-col slds-size_1-of-4">
                                <div class="slds-box slds-text-align_center">
                                    <p class="slds-text-heading_large slds-text-color_weak">—</p>
                                    <p class="slds-text-body_small">Pending</p>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-4">
                                <div class="slds-box slds-text-align_center">
                                    <p class="slds-text-heading_large slds-text-color_weak">—</p>
                                    <p class="slds-text-body_small">Failed</p>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-4">
                                <div class="slds-box slds-text-align_center">
                                    <p class="slds-text-heading_large slds-text-color_weak">—</p>
                                    <p class="slds-text-body_small">Success</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Configured - Show Stats -->
            <template if:true={isConfigured}>
                <div class="slds-grid slds-wrap slds-gutters slds-var-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-box slds-text-align_center">
                            <p class="slds-text-heading_large" style="color: #ff9900;">{status.pendingCount}</p>
                            <p class="slds-text-body_small">Pending</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-box slds-text-align_center">
                            <p class="slds-text-heading_large slds-text-color_error">{status.failedCount}</p>
                            <p class="slds-text-body_small">Failed</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-box slds-text-align_center">
                            <p class="slds-text-heading_large slds-text-color_success">{status.successCount}</p>
                            <p class="slds-text-body_small">Success</p>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
