
<template>
    <lightning-card title="Inventory Overview"
                    icon-name="standard:product">

        <div class="slds-p-around_medium">

            <!-- Statistics -->
            <div class="slds-grid slds-wrap slds-gutters">

                <div class="slds-col slds-size_1-of-1
                            slds-medium-size_1-of-3">
                    <div class="stat-card reorder">
                        <p>Reorder Needed</p>
                        <h2>{reorderNeededCount}</h2>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1
                            slds-medium-size_1-of-3">
                    <div class="stat-card risk">
                        <p>At Risk</p>
                        <h2>{atRiskCount}</h2>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1
                            slds-medium-size_1-of-3">
                    <div class="stat-card healthy">
                        <p>Healthy</p>
                        <h2>{healthyCount}</h2>
                    </div>
                </div>

            </div>

            <!-- Filters -->
            <div class="slds-grid slds-wrap slds-gutters
                        slds-m-top_large slds-m-bottom_medium">

                <div class="slds-col slds-size_1-of-1
                            slds-medium-size_1-of-3">

                    <lightning-input
                        type="search"
                        label="Search Product / Warehouse"
                        value={searchTerm}
                        onchange={handleSearchChange}>
                    </lightning-input>

                </div>

                <div class="slds-col slds-size_1-of-1
                            slds-medium-size_1-of-3">

                    <lightning-combobox
                        label="Inventory Status"
                        value={reorderStatusFilter}
                        options={statusOptions}
                        onchange={handleStatusFilterChange}>
                    </lightning-combobox>

                </div>

                <div class="slds-col slds-size_1-of-1
                            slds-medium-size_1-of-3">

                    <lightning-combobox
                        label="Warehouse"
                        value={warehouseFilter}
                        options={warehouseOptions}
                        onchange={handleWarehouseFilterChange}>
                    </lightning-combobox>

                </div>

            </div>

            <!-- Refresh -->
            <div class="slds-grid slds-grid_align-end
                        slds-m-bottom_small">

                <lightning-button
                    label="Refresh"
                    icon-name="utility:refresh"
                    onclick={handleRefresh}>
                </lightning-button>

            </div>

            <!-- Loading -->
            <template lwc:if={isLoading}>
                <lightning-spinner
                    alternative-text="Loading inventory"
                    size="medium">
                </lightning-spinner>
            </template>

            <!-- Error -->
            <template lwc:if={error}>
                <div class="slds-notify slds-notify_alert
                            slds-alert_error slds-m-around_medium">
                    {error}
                </div>
            </template>

            <!-- Inventory Table -->
            <template lwc:if={hasData}>

                <lightning-datatable
                    key-field="inventoryId"
                    data={paginatedData}
                    columns={columns}
                    sorted-by={sortedBy}
                    sorted-direction={sortedDirection}
                    onsort={handleSort}
                    onrowaction={handleRowAction}
                    hide-checkbox-column>
                </lightning-datatable>

                <!-- Pagination -->
                <div class="pagination slds-m-top_medium">

                    <span>
                        Total Records: {totalItems}
                    </span>

                    <div class="slds-grid slds-grid_vertical-align-center">

                        <lightning-button
                            label="Previous"
                            onclick={handlePreviousPage}
                            disabled={isFirstPage}>
                        </lightning-button>

                        <span class="slds-m-horizontal_medium">
                            Page {currentPage} of {totalPages}
                        </span>

                        <lightning-button
                            label="Next"
                            onclick={handleNextPage}
                            disabled={isLastPage}>
                        </lightning-button>

                    </div>

                </div>

            </template>

            <!-- Empty -->
            <template lwc:if={isEmpty}>
                <div class="empty-state">
                    <lightning-icon
                        icon-name="utility:info"
                        size="large">
                    </lightning-icon>

                    <h3>No Inventory Records Found</h3>
                    <p>Try changing your search or filters.</p>
                </div>
            </template>

        </div>

    </lightning-card>
</template>
