<template>
    <lightning-card title={cardTitle} icon-name="standard:orders">
        <div slot="actions">
            <template if:true={isEditable}>
                <lightning-button variant="neutral" label="Save" onclick={handleSave} disabled={isSaving}></lightning-button>
            </template>
            <template if:true={canDispatch}>
                <lightning-button
                    variant="brand"
                    label="Dispatch Order"
                    icon-name="utility:send"
                    onclick={handleDispatch}
                    disabled={isSaving}
                    class="slds-var-m-left_x-small">
                </lightning-button>
            </template>
        </div>

        <div class="slds-var-m-around_medium">
            <!-- Messages -->
            <template if:true={successMessage}>
                <div class="slds-notify slds-notify_toast slds-theme_success slds-var-m-bottom_medium" role="status">
                    <p>{successMessage}</p>
                </div>
            </template>
            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-var-m-bottom_medium" role="alert">
                    <p>{errorMessage}</p>
                </div>
            </template>

            <!-- Status Badge -->
            <div class="slds-var-m-bottom_medium">
                <lightning-badge label={orderStatus} class={statusBadgeClass}></lightning-badge>
            </div>

            <!-- Order Header -->
            <fieldset class="slds-box slds-var-m-bottom_medium">
                <legend class="slds-text-heading_small slds-var-m-bottom_small">Order Details</legend>
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            label="Order Date"
                            type="date"
                            value={order.Order_Date__c}
                            onchange={handleFieldChange}
                            data-field="Order_Date__c"
                            disabled={isLocked}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            label="Expected Delivery"
                            type="date"
                            value={order.Expected_Delivery__c}
                            onchange={handleFieldChange}
                            data-field="Expected_Delivery__c"
                            disabled={isLocked}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            label="Supplier Reference"
                            value={order.Supplier_Order_Reference__c}
                            onchange={handleFieldChange}
                            data-field="Supplier_Order_Reference__c"
                            disabled={isLocked}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            label="Tax Amount"
                            type="number"
                            step="0.01"
                            value={order.Tax_Amount__c}
                            onchange={handleFieldChange}
                            data-field="Tax_Amount__c"
                            disabled={isLocked}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            label="Shipping Amount"
                            type="number"
                            step="0.01"
                            value={order.Shipping_Amount__c}
                            onchange={handleFieldChange}
                            data-field="Shipping_Amount__c"
                            disabled={isLocked}>
                        </lightning-input>
                    </div>
                </div>
            </fieldset>

            <!-- Order Lines -->
            <fieldset class="slds-box slds-var-m-bottom_medium">
                <legend class="slds-text-heading_small slds-var-m-bottom_small">
                    Order Lines
                    <template if:true={isEditable}>
                        <lightning-button variant="neutral" label="Add Line" icon-name="utility:add" onclick={handleAddLine} size="small" class="slds-var-m-left_medium"></lightning-button>
                    </template>
                </legend>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th><div class="slds-truncate">Product</div></th>
                            <th><div class="slds-truncate">Qty Ordered</div></th>
                            <th><div class="slds-truncate">Qty Received</div></th>
                            <th><div class="slds-truncate">Unit Price</div></th>
                            <th><div class="slds-truncate">Line Total</div></th>
                            <th><div class="slds-truncate">Status</div></th>
                            <template if:true={isEditable}>
                                <th><div class="slds-truncate">Del</div></th>
                            </template>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={lines} for:item="line" for:index="idx">
                            <tr key={line._key}>
                                <td><div class="slds-truncate">{line.productName}</div></td>
                                <td>
                                    <lightning-input type="number" label="" value={line.Quantity_Ordered__c} min="1" data-idx={idx} data-field="Quantity_Ordered__c" onchange={handleLineFieldChange} disabled={isLocked}></lightning-input>
                                </td>
                                <td class="slds-text-align_right">{line.Quantity_Received__c}</td>
                                <td>
                                    <lightning-input type="number" label="" value={line.Unit_Price__c} min="0" step="0.01" data-idx={idx} data-field="Unit_Price__c" onchange={handleLineFieldChange} disabled={isLocked}></lightning-input>
                                </td>
                                <td class="slds-text-align_right">
                                    <lightning-formatted-number value={line.lineTotal} format-style="currency" currency-code="INR"></lightning-formatted-number>
                                </td>
                                <td>{line.Line_Status__c}</td>
                                <template if:true={isEditable}>
                                    <td>
                                        <lightning-button-icon icon-name="utility:delete" alternative-text="Delete" data-idx={idx} onclick={handleDeleteLine} variant="error"></lightning-button-icon>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <!-- Financial Summary -->
                <div class="slds-grid slds-grid_align-end slds-var-m-top_medium">
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-box">
                            <div class="slds-grid slds-var-m-bottom_x-small">
                                <span class="slds-col">Subtotal:</span>
                                <lightning-formatted-number value={calculatedSubtotal} format-style="currency" currency-code="INR" class="slds-col slds-text-align_right"></lightning-formatted-number>
                            </div>
                            <div class="slds-grid slds-var-m-bottom_x-small">
                                <span class="slds-col">Tax:</span>
                                <lightning-formatted-number value={order.Tax_Amount__c} format-style="currency" currency-code="INR" class="slds-col slds-text-align_right"></lightning-formatted-number>
                            </div>
                            <div class="slds-grid slds-var-m-bottom_x-small">
                                <span class="slds-col">Shipping:</span>
                                <lightning-formatted-number value={order.Shipping_Amount__c} format-style="currency" currency-code="INR" class="slds-col slds-text-align_right"></lightning-formatted-number>
                            </div>
                            <div class="slds-grid slds-border_top slds-var-m-top_x-small">
                                <span class="slds-col slds-text-heading_small">Total:</span>
                                <lightning-formatted-number value={calculatedTotal} format-style="currency" currency-code="INR" class="slds-col slds-text-heading_small slds-text-align_right"></lightning-formatted-number>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>

            <template if:true={isSaving}>
                <lightning-spinner alternative-text="Processing..." size="medium"></lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
