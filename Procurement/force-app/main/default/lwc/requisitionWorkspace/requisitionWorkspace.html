<template>
    <lightning-card title={cardTitle} icon-name="standard:work_order">
        <div slot="actions">
            <template if:true={isEditable}>
                <lightning-button
                    variant="neutral"
                    label="Save Draft"
                    onclick={handleSave}
                    disabled={isSaving}>
                </lightning-button>
                <lightning-button
                    variant="brand"
                    label="Submit for Approval"
                    onclick={handleSubmit}
                    disabled={isSaving}
                    class="slds-var-m-left_x-small">
                </lightning-button>
            </template>
        </div>
        <div class="slds-var-m-around_medium">

            <!-- Messages -->
            <template if:true={successMessage}>
                <div class="slds-notify slds-notify_toast slds-theme_success slds-var-m-bottom_medium" role="status">
                    <p>{successMessage}</p>
                </div>
            </template>
            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-var-m-bottom_medium" role="alert">
                    <p>{errorMessage}</p>
                </div>
            </template>

            <!-- Lock Banner -->
            <template if:true={isLocked}>
                <div class="slds-notify slds-notify_alert slds-theme_info slds-var-m-bottom_medium" role="alert">
                    <lightning-icon icon-name="utility:lock" size="x-small"></lightning-icon>
                    <span class="slds-var-m-left_x-small">This requisition is locked (Status: {requisition.Status__c}). Read-only view.</span>
                </div>
            </template>

            <!-- Header Section -->
            <fieldset class="slds-box slds-var-m-bottom_medium">
                <legend class="slds-text-heading_small slds-var-m-bottom_small">Requisition Details</legend>
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            label="Request Date"
                            type="date"
                            value={requisition.Request_Date__c}
                            onchange={handleFieldChange}
                            data-field="Request_Date__c"
                            disabled={isLocked}
                            required>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            label="Required By"
                            type="date"
                            value={requisition.Required_By__c}
                            onchange={handleFieldChange}
                            data-field="Required_By__c"
                            disabled={isLocked}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-combobox
                            label="Priority"
                            value={requisition.Priority__c}
                            options={priorityOptions}
                            onchange={handleFieldChange}
                            data-field="Priority__c"
                            disabled={isLocked}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            label="Reason / Justification"
                            value={requisition.Reason__c}
                            onchange={handleFieldChange}
                            data-field="Reason__c"
                            disabled={isLocked}>
                        </lightning-input>
                    </div>
                </div>
            </fieldset>

            <!-- Line Items Section -->
            <fieldset class="slds-box slds-var-m-bottom_medium">
                <legend class="slds-text-heading_small slds-var-m-bottom_small">
                    Line Items
                    <template if:true={isEditable}>
                        <lightning-button
                            variant="neutral"
                            label="Add Line"
                            icon-name="utility:add"
                            onclick={handleAddLine}
                            size="small"
                            class="slds-var-m-left_medium">
                        </lightning-button>
                    </template>
                </legend>

                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th style="width: 35%"><div class="slds-truncate">Product</div></th>
                            <th style="width: 15%"><div class="slds-truncate">Qty</div></th>
                            <th style="width: 15%"><div class="slds-truncate">Unit Price</div></th>
                            <th style="width: 15%"><div class="slds-truncate">Line Total</div></th>
                            <th style="width: 15%"><div class="slds-truncate">Notes</div></th>
                            <template if:true={isEditable}>
                                <th style="width: 5%"><div class="slds-truncate">Del</div></th>
                            </template>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={lines} for:item="line" for:index="idx">
                            <tr key={line._key}>
                                <td>
                                    <template if:true={isEditable}>
                                        <lightning-record-picker
                                            label=""
                                            object-api-name="Product2"
                                            value={line.Product__c}
                                            placeholder="Search product..."
                                            data-idx={idx}
                                            onchange={handleLineProductChange}>
                                        </lightning-record-picker>
                                    </template>
                                    <template if:false={isEditable}>
                                        <span>{line.productName}</span>
                                    </template>
                                </td>
                                <td>
                                    <lightning-input
                                        type="number"
                                        label=""
                                        value={line.Requested_Qty__c}
                                        min="1"
                                        data-idx={idx}
                                        data-field="Requested_Qty__c"
                                        onchange={handleLineFieldChange}
                                        disabled={isLocked}>
                                    </lightning-input>
                                </td>
                                <td>
                                    <lightning-input
                                        type="number"
                                        label=""
                                        value={line.Estimated_Unit_Price__c}
                                        min="0"
                                        step="0.01"
                                        formatter="currency"
                                        data-idx={idx}
                                        data-field="Estimated_Unit_Price__c"
                                        onchange={handleLineFieldChange}
                                        disabled={isLocked}>
                                    </lightning-input>
                                </td>
                                <td>
                                    <lightning-formatted-number
                                        value={line.lineTotal}
                                        format-style="currency"
                                        currency-code="INR">
                                    </lightning-formatted-number>
                                </td>
                                <td>
                                    <lightning-input
                                        label=""
                                        value={line.Line_Notes__c}
                                        data-idx={idx}
                                        data-field="Line_Notes__c"
                                        onchange={handleLineFieldChange}
                                        disabled={isLocked}>
                                    </lightning-input>
                                </td>
                                <template if:true={isEditable}>
                                    <td>
                                        <lightning-button-icon
                                            icon-name="utility:delete"
                                            alternative-text="Delete line"
                                            data-idx={idx}
                                            onclick={handleDeleteLine}
                                            variant="error">
                                        </lightning-button-icon>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <!-- Total -->
                <div class="slds-grid slds-grid_align-end slds-var-m-top_medium">
                    <div class="slds-col slds-size_1-of-3 slds-box">
                        <div class="slds-grid">
                            <span class="slds-col slds-text-heading_small">Estimated Total:</span>
                            <lightning-formatted-number
                                value={estimatedTotal}
                                format-style="currency"
                                currency-code="INR"
                                class="slds-col slds-text-heading_small">
                            </lightning-formatted-number>
                        </div>
                    </div>
                </div>
            </fieldset>

            <template if:true={isSaving}>
                <lightning-spinner alternative-text="Saving..." size="medium"></lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
